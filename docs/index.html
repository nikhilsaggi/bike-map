<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NYC Bike Routes</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d0d0d; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  #map { width: 100vw; height: 100vh; }

  #stats {
    position: absolute; top: 12px; right: 12px; z-index: 1000;
    background: rgba(13, 13, 13, 0.88); color: #ccc; padding: 12px 16px;
    border-radius: 8px; font-size: 13px; line-height: 1.6;
    border: 1px solid #333; backdrop-filter: blur(6px);
  }
  #stats strong { color: #fff; }
  #stats .label { color: #888; }
  #stat-years {
    display: none; margin-top: 8px; padding-top: 8px; border-top: 1px solid #333;
    font-size: 11px; line-height: 1.5;
  }
  #stat-years .year-row { display: flex; justify-content: space-between; gap: 16px; }
  #stat-riding {
    display: none; margin-top: 8px; padding-top: 8px; border-top: 1px solid #333;
    font-size: 11px; line-height: 1.6;
  }
  #stat-riding .r-row { display: flex; justify-content: space-between; gap: 16px; }
  .histo { display: flex; align-items: flex-end; gap: 1px; height: 26px; margin: 3px 0 1px; }
  .histo div { flex: 1; background: #7b3ff2; border-radius: 1px 1px 0 0; min-height: 1px; }
  .histo-labels { display: flex; justify-content: space-between; font-size: 9px; color: #666; }
  .histo-title { color: #888; margin-top: 6px; }

  #legend {
    position: absolute; bottom: 28px; left: 12px; z-index: 1000;
    background: rgba(13, 13, 13, 0.88); color: #ccc; padding: 12px 16px;
    border-radius: 8px; font-size: 12px; border: 1px solid #333;
    backdrop-filter: blur(6px);
  }
  #legend .title { font-weight: 600; color: #fff; margin-bottom: 8px; }
  #legend .bar {
    width: 180px; height: 12px; border-radius: 3px; margin-bottom: 4px;
  }
  #legend .labels { display: flex; justify-content: space-between; font-size: 11px; color: #888; }
  #filter-row {
    display: none; align-items: center; gap: 8px; margin-top: 10px;
    font-size: 11px; color: #888;
  }
  #play-btn {
    background: #1a1a1a; color: #ccc; border: 1px solid #333; border-radius: 4px;
    width: 24px; height: 24px; font-size: 11px; cursor: pointer; flex: none;
    display: flex; align-items: center; justify-content: center;
  }
  #play-btn:hover { color: #fff; border-color: #555; }
  #slider { position: relative; width: 148px; height: 20px; flex: none; }
  #slider-track {
    position: absolute; top: 8px; left: 0; right: 0; height: 4px;
    background: #333; border-radius: 2px;
  }
  #slider-range {
    position: absolute; top: 8px; height: 4px; background: #999; border-radius: 2px;
  }
  #slider input[type=range] {
    position: absolute; left: 0; top: 0; width: 100%; height: 20px; margin: 0;
    -webkit-appearance: none; appearance: none; background: none; pointer-events: none;
  }
  #slider input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; pointer-events: auto; cursor: pointer;
    width: 13px; height: 13px; border-radius: 50%;
    background: #ddd; border: 1px solid #666;
  }
  #slider input[type=range]::-moz-range-thumb {
    pointer-events: auto; cursor: pointer;
    width: 11px; height: 11px; border-radius: 50%;
    background: #ddd; border: 1px solid #666;
  }
  #filter-dates {
    display: none; justify-content: space-between; margin-top: 4px;
    font-size: 10px; color: #888; font-variant-numeric: tabular-nums;
  }
  .ride-popup .leaflet-popup-content-wrapper {
    background: rgba(13, 13, 13, 0.92); color: #fff; border-radius: 8px;
    border: 1px solid #444; backdrop-filter: blur(6px);
  }
  .ride-popup .leaflet-popup-tip { background: rgba(13, 13, 13, 0.92); }
  .ride-popup .leaflet-popup-close-button { color: #888; }
  .ride-popup .leaflet-popup-close-button:hover { color: #fff; }
</style>
</head>
<body>
<div id="map"></div>

<div id="stats">
  <div><span class="label">Rides:</span> <strong id="stat-rides">—</strong></div>
  <div><span class="label">Edges:</span> <strong id="stat-edges">—</strong></div>
  <div><span class="label">Street mi:</span> <strong id="stat-km">—</strong></div>
  <div id="stat-explored-row" style="display:none" title="Share of plausibly rideable streets in the mapped area (footways, motorways, service ways excluded)"><span class="label">Explored:</span> <strong id="stat-explored">—</strong></div>
  <div><span class="label">Updated:</span> <strong id="stat-updated">—</strong></div>
  <div id="stat-years"></div>
  <div id="stat-riding"></div>
</div>

<div id="legend">
  <div class="title">Ride frequency</div>
  <div class="bar" id="legend-bar"></div>
  <div class="labels"><span>1</span><span id="legend-max">—</span></div>
  <div id="filter-row">
    <button id="play-btn" title="Play time-lapse">&#9654;</button>
    <div id="slider">
      <div id="slider-track"></div>
      <div id="slider-range"></div>
      <input type="range" id="range-lo" min="0" value="0" step="1">
      <input type="range" id="range-hi" min="0" value="0" step="1">
    </div>
  </div>
  <div id="filter-dates"><span id="date-lo"></span><span id="date-hi"></span></div>
</div>

<script>
const map = L.map('map', {
  center: [40.735, -73.96],
  zoom: 13,
  zoomControl: true,
  attributionControl: true,
  preferCanvas: true,
  renderer: L.canvas(),
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd',
  maxZoom: 19,
}).addTo(map);

// Plasma-style color stops (purple -> blue -> orange -> yellow)
const PLASMA = [
  [0.0,  [13, 8, 135]],
  [0.15, [74, 3, 168]],
  [0.3,  [131, 3, 163]],
  [0.45, [180, 34, 130]],
  [0.6,  [220, 75, 85]],
  [0.75, [246, 128, 38]],
  [0.9,  [252, 194, 2]],
  [1.0,  [240, 249, 33]],
];

function plasmaColor(t) {
  t = Math.max(0, Math.min(1, t));
  for (let i = 0; i < PLASMA.length - 1; i++) {
    const [t0, c0] = PLASMA[i];
    const [t1, c1] = PLASMA[i + 1];
    if (t <= t1) {
      const f = (t - t0) / (t1 - t0);
      const r = Math.round(c0[0] + f * (c1[0] - c0[0]));
      const g = Math.round(c0[1] + f * (c1[1] - c0[1]));
      const b = Math.round(c0[2] + f * (c1[2] - c0[2]));
      return `rgb(${r},${g},${b})`;
    }
  }
  const last = PLASMA[PLASMA.length - 1][1];
  return `rgb(${last[0]},${last[1]},${last[2]})`;
}

function buildGradientCSS() {
  const stops = PLASMA.map(([t, c]) => `rgb(${c[0]},${c[1]},${c[2]}) ${t * 100}%`);
  return `linear-gradient(to right, ${stops.join(', ')})`;
}
document.getElementById('legend-bar').style.background = buildGradientCSS();

// ride_dates on each feature are indices into the global dateList;
// [filterLo, filterHi] selects the active index range.
let dateList = [];
let filterLo = 0;
let filterHi = Infinity;
let sqrtMax = 1;
let fullMaxCount = 1;
let geoLayer = null;

function countInRange(idxs) {
  if (filterLo === 0 && filterHi === Infinity) return idxs.length;
  let n = 0;
  for (const di of idxs) if (di >= filterLo && di <= filterHi) n++;
  return n;
}

function styleFor(count) {
  const t = Math.sqrt(count) / sqrtMax;
  return {
    color: plasmaColor(t),
    weight: 1.5 + t * 4,
    opacity: 0.85,
    lineJoin: 'round',
    lineCap: 'round',
  };
}

function popupContent(idxs) {
  const perDate = new Map();
  let count = 0;
  for (const di of idxs) {
    if (di < filterLo || di > filterHi) continue;
    count++;
    const d = dateList[di] ?? String(di);
    perDate.set(d, (perDate.get(d) || 0) + 1);
  }
  const header = `<strong>${count} ride${count !== 1 ? 's' : ''}</strong>`;
  const list = [...perDate.entries()]
    .map(([d, n]) => `<div style="color:#ccc;font-size:12px">${d}${n > 1 ? ` &times;${n}` : ''}</div>`)
    .join('');
  return `<div style="max-height:200px;overflow-y:auto">${header}${list}</div>`;
}

// renormalize=true rescales colors to the filtered max and restyles every
// layer; renormalize=false keeps the current scale and only restyles layers
// whose count changed (cheap enough to run every animation frame).
function applyFilter(renormalize = true) {
  let filteredMax = 1;
  geoLayer.eachLayer(layer => {
    const c = countInRange(layer.feature.properties.ride_dates || []);
    layer._newCount = c;
    if (c > filteredMax) filteredMax = c;
  });
  if (renormalize) {
    sqrtMax = Math.sqrt(filteredMax);
    document.getElementById('legend-max').textContent = filteredMax;
  }
  geoLayer.eachLayer(layer => {
    const c = layer._newCount;
    if (!renormalize && c === layer._filteredCount) return;
    layer._filteredCount = c;
    if (c === 0) {
      map.removeLayer(layer);
    } else {
      if (!map.hasLayer(layer)) layer.addTo(map);
      layer.setStyle(styleFor(c));
    }
  });
  restackLayers();
}

// Restack visible lines so frequent (bright) edges draw above rare (dark)
// ones -- remove/re-add during filtering otherwise scrambles the initial
// count-sorted order. Runs on every filter change (including each playback
// frame, where re-added streets land on top and growing counts reorder
// lines): sort + bringToFront are cheap linked-list moves on canvas,
// small next to the full redraw each frame already triggers.
function restackLayers() {
  const visible = [];
  geoLayer.eachLayer(l => { if (l._filteredCount > 0) visible.push(l); });
  visible.sort((a, b) => a._filteredCount - b._filteredCount);
  for (const l of visible) l.bringToFront();
}

// -- Date-range slider + time-lapse playback --------------------------------

const PLAY_DURATION_MS = 25000;
let playing = false;

function initDateFilter() {
  if (dateList.length < 2) return;
  const last = dateList.length - 1;
  const lo = document.getElementById('range-lo');
  const hi = document.getElementById('range-hi');
  const btn = document.getElementById('play-btn');
  lo.max = last;
  hi.max = last;
  lo.value = 0;
  hi.value = last;

  function updateUI() {
    const a = +lo.value;
    const b = +hi.value;
    document.getElementById('date-lo').textContent = dateList[a];
    document.getElementById('date-hi').textContent = dateList[b];
    const bar = document.getElementById('slider-range');
    bar.style.left = `${(a / last) * 100}%`;
    bar.style.width = `${((b - a) / last) * 100}%`;
  }

  let pending = false;
  let fromPlayback = false;
  function onInput(moved) {
    if (fromPlayback) return;
    if (playing) stopPlay();
    // Keep handles ordered by pushing the one that was not moved
    if (+lo.value > +hi.value) {
      if (moved === lo) hi.value = lo.value;
      else lo.value = hi.value;
    }
    filterLo = +lo.value;
    filterHi = +hi.value === last ? Infinity : +hi.value;
    updateUI();
    if (!pending) {
      pending = true;
      requestAnimationFrame(() => {
        pending = false;
        applyFilter();
      });
    }
  }
  lo.addEventListener('input', () => onInput(lo));
  hi.addEventListener('input', () => onInput(hi));

  let playRAF = null;
  function stopPlay() {
    playing = false;
    if (playRAF) cancelAnimationFrame(playRAF);
    btn.innerHTML = '&#9654;';
    applyFilter();  // renormalize to wherever playback stopped
  }

  function startPlay() {
    playing = true;
    btn.innerHTML = '&#10074;&#10074;';
    // Freeze the color scale at the full-history max so streets deepen in
    // color as they accumulate rides, instead of renormalizing every frame.
    sqrtMax = Math.sqrt(fullMaxCount);
    document.getElementById('legend-max').textContent = fullMaxCount;
    fromPlayback = true;
    lo.value = 0;
    fromPlayback = false;
    const t0 = performance.now();
    let lastHi = -1;
    function frame(now) {
      if (!playing) return;
      const p = Math.min(1, (now - t0) / PLAY_DURATION_MS);
      const h = Math.round(p * last);
      if (h !== lastHi) {
        lastHi = h;
        filterLo = 0;
        filterHi = h === last ? Infinity : h;
        fromPlayback = true;
        hi.value = h;
        fromPlayback = false;
        updateUI();
        applyFilter(false);
      }
      if (p < 1) playRAF = requestAnimationFrame(frame);
      else stopPlay();
    }
    playRAF = requestAnimationFrame(frame);
  }

  btn.addEventListener('click', () => (playing ? stopPlay() : startPlay()));

  updateUI();
  document.getElementById('filter-row').style.display = 'flex';
  document.getElementById('filter-dates').style.display = 'flex';
}

fetch('rides.geojson.gz')
  .then(r => {
    const ds = new DecompressionStream('gzip');
    const decompressed = r.body.pipeThrough(ds);
    return new Response(decompressed).json();
  })
  .then(data => {
    const totalRides = data.properties?.total_rides ?? '—';
    const totalEdges = data.properties?.total_edges ?? '—';
    const updated = data.properties?.updated ?? '—';
    const maxCount = data.properties?.max_count ?? 1;
    dateList = data.properties?.dates ?? [];

    document.getElementById('stat-rides').textContent = totalRides.toLocaleString();
    document.getElementById('stat-edges').textContent = totalEdges.toLocaleString();
    document.getElementById('stat-updated').textContent = updated;
    document.getElementById('legend-max').textContent = maxCount;

    // Pipeline data is metric; convert to miles for display only.
    const KM_TO_MI = 0.621371;
    const mi = km => km * KM_TO_MI;
    const totalKm = data.properties?.total_km;
    if (totalKm != null) {
      document.getElementById('stat-km').textContent = Math.round(mi(totalKm)).toLocaleString();
    }
    const ridesPerYear = data.properties?.rides_per_year;
    const riding = data.properties?.riding;
    const coverage = data.properties?.coverage;
    if (coverage?.pct != null) {
      document.getElementById('stat-explored').textContent =
        `${coverage.pct}% of ${Math.round(mi(coverage.network_km)).toLocaleString()} mi`;
      document.getElementById('stat-explored-row').style.display = 'block';
    }
    if (ridesPerYear && Object.keys(ridesPerYear).length) {
      const kmByYear = riding?.km_by_year || {};
      const newByYear = coverage?.new_km_by_year || {};
      const el = document.getElementById('stat-years');
      el.innerHTML = Object.entries(ridesPerYear)
        .map(([y, n]) => {
          const km = kmByYear[y] != null ? ` &middot; ${Math.round(mi(kmByYear[y])).toLocaleString()} mi` : '';
          const nw = newByYear[y] != null ? ` &middot; +${Math.round(mi(newByYear[y]))} new` : '';
          return `<div class="year-row"><span class="label">${y}</span><span><strong>${n}</strong><span class="label">${km}${nw}</span></span></div>`;
        })
        .join('');
      el.style.display = 'block';
    }

    if (riding) {
      const histo = (counts, labels) => {
        const max = Math.max(...counts, 1);
        const bars = counts
          .map(c => `<div style="height:${Math.max(4, Math.round(100 * c / max))}%" title="${c} rides"></div>`)
          .join('');
        return `<div class="histo">${bars}</div><div class="histo-labels">${labels}</div>`;
      };
      const rows = [
        ['Distance', `${Math.round(mi(riding.total_km)).toLocaleString()} mi`],
        ['Time', `${Math.round(riding.total_h).toLocaleString()} h`],
        riding.avg_kmh != null ? ['Avg speed', `${(mi(riding.avg_kmh)).toFixed(1)} mph`] : null,
        ['Longest ride', `${Math.round(mi(riding.longest_km))} mi`],
      ].filter(Boolean)
        .map(([k, v]) => `<div class="r-row"><span class="label">${k}</span><strong>${v}</strong></div>`)
        .join('');
      document.getElementById('stat-riding').innerHTML = rows +
        `<div class="histo-title">Rides by hour</div>` +
        histo(riding.by_hour, '<span>12am</span><span>6</span><span>noon</span><span>6</span><span>11pm</span>') +
        `<div class="histo-title">Rides by weekday</div>` +
        histo(riding.by_weekday, '<span>Mon</span><span>Sun</span>');
      document.getElementById('stat-riding').style.display = 'block';
    }

    sqrtMax = Math.sqrt(maxCount);
    fullMaxCount = maxCount;

    geoLayer = L.geoJSON(data, {
      style: feature => styleFor((feature.properties.ride_dates || []).length || 1),
      onEachFeature: (feature, layer) => {
        const idxs = feature.properties.ride_dates || [];
        layer._filteredCount = idxs.length;
        layer.bindTooltip(() => {
          const c = countInRange(idxs);
          return `${c} ride${c !== 1 ? 's' : ''}`;
        }, {
          sticky: true,
          className: 'ride-tooltip',
        });
        if (idxs.length) {
          layer.bindPopup(() => popupContent(idxs), { className: 'ride-popup' });
        }
      },
    }).addTo(map);

    initDateFilter();
  })
  .catch(err => {
    document.getElementById('stat-rides').textContent = 'Error loading data';
    console.error('Failed to load rides.geojson:', err);
  });
</script>
</body>
</html>
