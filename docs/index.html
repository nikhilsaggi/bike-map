<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NYC Bike Routes</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d0d0d; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  #map { width: 100vw; height: 100vh; }

  /* The stats panel is an ambient header plus a chip strip that opens exactly
     one detail section at a time.  Stacking every section at once ran to ~32
     rows and 670-1080px, burying the map the panel floats over. */
  #stats {
    position: absolute; top: 12px; right: 12px; z-index: 1000;
    /* Fixed content width, not a share of the viewport: everything inside is
       width-driven (hero grid, right-justified rows, flex:1 histogram bars),
       so a phone-width panel stretches them all to ~1.7x. Only a viewport
       narrower than the panel itself shrinks it. */
    width: min(236px, calc(100vw - 24px));
    background: rgba(13, 13, 13, 0.88); color: #ccc; padding: 12px 16px;
    border-radius: 8px; font-size: 13px; line-height: 1.6;
    border: 1px solid #333; backdrop-filter: blur(6px);
  }
  #stats strong { color: #fff; }
  #stats .label { color: #888; }
  #stats-toggle {
    position: absolute; top: 6px; right: 8px; z-index: 1;
    background: none; border: none; color: #888; cursor: pointer;
    font-size: 14px; line-height: 1; padding: 2px 4px;
  }
  #stats-toggle:hover { color: #fff; }
  #stats-collapsed-label { display: none; color: #ccc; font-size: 12px; }
  #stats.collapsed #stats-body { display: none; }
  #stats.collapsed { width: auto; padding: 8px 32px 8px 14px; }
  #stats.collapsed #stats-collapsed-label { display: inline; }
  /* Backstop only.  With one section open the panel fits every viewport we
     target; a very short window still needs somewhere to scroll. */
  #stats-body { max-height: calc(100vh - 72px); overflow-y: auto; }

  /* Hero: effort on the top row, coverage on the bottom.  Tiles hide
     individually so a partial payload leaves no empty cells. */
  #stat-hero {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px;
    padding-right: 22px;  /* clear the collapse button */
  }
  .hero-tile { display: flex; flex-direction: column; line-height: 1.2; }
  .hero-tile strong { font-size: 17px; font-variant-numeric: tabular-nums; }
  .hero-tile .label { font-size: 10px; }
  .hero-tile.hidden { display: none; }
  #stat-updated-row { margin-top: 8px; font-size: 10px; line-height: 1.4; }
  #stat-updated-row strong { font-variant-numeric: tabular-nums; }

  /* Tight enough that all four chips share one row at the panel's 236px;
     they wrap gracefully if a future section needs a longer name. */
  #stat-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 10px; }
  .chip {
    background: #1a1a1a; color: #ccc; border: 1px solid #333;
    border-radius: 11px; padding: 3px 7px; font: inherit; font-size: 10px;
    line-height: 1.4; cursor: pointer;
  }
  .chip:hover { color: #fff; border-color: #555; }
  .chip.active { background: #7b3ff2; border-color: #7b3ff2; color: #fff; }
  .chip.hidden { display: none; }

  /* The active chip is the open section's heading, which is why the sections
     below carry no headings of their own. */
  #stats-sections { display: none; }
  #stats-sections.open {
    display: block; margin-top: 8px; padding-top: 8px;
    border-top: 1px solid #333; padding-right: 4px;
    max-height: min(320px, calc(100vh - 300px)); overflow-y: auto;
    font-size: 11px; line-height: 1.6;
  }
  #stats-sections > div { display: none; }
  #stats-sections > div.open { display: block; }
  #stats-sections::-webkit-scrollbar { width: 6px; }
  #stats-sections::-webkit-scrollbar-track { background: transparent; }
  #stats-sections::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
  #stats-sections::-webkit-scrollbar-thumb:hover { background: #555; }
  #stats-sections { scrollbar-width: thin; scrollbar-color: #333 transparent; }

  #stat-years { line-height: 1.5; }
  /* One grid template shared by the header and every row, so the columns line
     up instead of each row right-justifying its own run-on text. */
  .year-head, .year-row {
    display: grid; grid-template-columns: 10px 30px 1fr 1fr 1fr;
    align-items: baseline; gap: 4px;
  }
  .year-head { color: #888; font-size: 9px; letter-spacing: 0.3px; }
  .year-row { cursor: pointer; padding: 1px 0; }
  .year-row:hover { color: #fff; }
  .year-row .y-caret { color: #666; font-size: 8px; }
  .year-row:hover .y-caret { color: #ccc; }
  .year-row.open .y-caret { color: #7b3ff2; }
  .year-head span:not(.y-year), .year-row span:not(.y-caret):not(.y-year) {
    text-align: right; font-variant-numeric: tabular-nums;
  }
  .year-row .y-new { color: #888; }
  .year-row.open { color: #fff; }
  .year-detail {
    display: none; margin: 2px 0 6px 14px; padding-left: 8px;
    border-left: 1px solid #333; color: #888; font-size: 10px; line-height: 1.6;
  }
  .year-row.open + .year-detail { display: block; }
  .yd-row { display: flex; justify-content: space-between; gap: 10px; }
  .yd-row .v { color: #ccc; text-align: right; }
  .yd-vs { margin-bottom: 2px; }
  .yd-link { color: #9fd8ff; cursor: pointer; }
  .yd-link:hover { text-decoration: underline; }
  .yd-link.on { color: #00e5ff; font-weight: 600; }
  .delta { color: #7bd88f; }
  .delta.neg { color: #e07a7a; }
  .r-row { display: flex; justify-content: space-between; gap: 16px; }
  .histo { display: flex; align-items: flex-end; gap: 1px; height: 26px; margin: 3px 0 1px; }
  .histo div { flex: 1; background: #7b3ff2; border-radius: 1px 1px 0 0; min-height: 1px; }
  .histo-labels { display: flex; justify-content: space-between; font-size: 9px; color: #666; }
  .histo-title { color: #888; margin-top: 6px; }
  .sub-title { color: #888; margin-top: 8px; margin-bottom: 2px; }
  #streets-totals .sub-title { margin-top: 0; }
  .weather-key { color: #666; font-size: 9px; margin-bottom: 1px; }
  .weather-key i { color: #ccc; font-style: normal; }
  .weather-bar-row { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
  .weather-bar-label { width: 62px; text-align: right; color: #888; font-size: 10px; flex: none; }
  .weather-bar-track {
    position: relative; flex: 1; height: 10px; background: #1a1a1a;
    border-radius: 3px; overflow: hidden;
  }
  .weather-bar-fill { height: 100%; background: #7b3ff2; border-radius: 3px; }
  /* Where the bar would end if this band drew rides in proportion to how
     often it occurs. Bar past the tick means sought out, short means avoided. */
  .weather-bar-tick { position: absolute; top: 0; bottom: 0; width: 2px; background: #ccc; }
  .weather-bar-val { width: 32px; color: #ccc; font-size: 10px; flex: none; }
  .weather-note { color: #777; font-size: 9px; line-height: 1.4; margin-top: 4px; }
  #stat-streets { line-height: 1.5; }
  #streets-totals .r-row { margin: 1px 0; }
  .r-sub { color: #666; font-size: 9px; text-align: right; margin: -1px 0 2px; }
  .r-link { color: #9fd8ff; cursor: pointer; }
  .r-link:hover { text-decoration: underline; }
  .r-link.on { color: #00e5ff; font-weight: 600; }
  #speed-block { display: none; }
  .sp-row {
    display: flex; align-items: baseline; gap: 6px; padding: 2px 0; cursor: pointer;
    border-bottom: 1px solid #1c1c1c;
  }
  .sp-row:last-child { border-bottom: none; }
  .sp-row:hover .sp-name { color: #fff; }
  .sp-row.on .sp-name, .sp-row.on:hover .sp-name { color: #00e5ff; font-weight: 600; }
  .sp-name { flex: 1; color: #9fd8ff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sp-dir {
    flex: none; color: #666; font-size: 9px; letter-spacing: 0.5px;
    font-variant-numeric: tabular-nums;
  }
  .sp-gap { flex: none; color: #fff; font-weight: 600; font-variant-numeric: tabular-nums; }
  .sp-detail { color: #666; font-size: 10px; padding: 0 0 4px 0; font-variant-numeric: tabular-nums; }
  #speed-lead { color: #777; font-size: 9px; line-height: 1.4; margin-bottom: 5px; }

  /* -- Citibike ----------------------------------------------------------
     A stats section with no map layer: the only things a dock trip could draw
     are a marker (which says nothing on its own) and a line to another dock
     (which is not a route), so it says its piece in text. */
  #src-row { display: flex; gap: 3px; margin-top: 8px; }
  #src-row.hidden { display: none; }
  .src-btn {
    flex: 1; background: #1a1a1a; color: #888; border: 1px solid #333;
    border-radius: 4px; padding: 3px 4px; font: inherit; font-size: 10px;
    line-height: 1.3; cursor: pointer;
  }
  .src-btn:hover { color: #ccc; border-color: #555; }
  .src-btn.on { background: #7b3ff2; border-color: #7b3ff2; color: #fff; }
  #src-note { color: #666; font-size: 9px; line-height: 1.4; margin-top: 3px; }
  /* Source tags wherever a ride is already named. Citibike takes the dock
     layer's tone so the two read as the same fact; an unknown ride is left
     unlabelled rather than guessed at. */
  .src-tag { font-size: 10px; }
  .src-tag.cb { color: #a8d8e8; }
  .src-tag.own { color: #888; }
  #cb-toggle {
    display: block; margin-top: 8px; padding-top: 8px; border-top: 1px solid #333;
    color: #888; font-size: 11px; cursor: pointer; user-select: none;
  }
  #cb-toggle.hidden { display: none; }
  #cb-toggle:hover { color: #ccc; }
  #cb-check { vertical-align: -1px; margin-right: 3px; accent-color: #a8d8e8; }
  /* The ride history starts in 2021 and the dock trips in 2025, so most of
     the slider's range has no docks in it at all. Saying so here is the
     difference between "nothing to show" and "this is broken". */
  #cb-range { color: #555; font-size: 9px; }
  .dock-popup { max-height: 200px; overflow-y: auto; }
  .dock-head { color: #a8d8e8; font-weight: 600; }
  .dock-sub { color: #666; font-size: 10px; margin-bottom: 3px; }
  .dock-count { color: #666; }
  /* A dock with no coordinates cannot be jumped to, so it gets none of the
     link affordance -- looking clickable and doing nothing is worse than
     plainly not being a link. */
  .dock-row-flat { color: #888; font-size: 12px; }
  #stat-citibike { line-height: 1.5; }
  /* One grid for the header and every row, so the two columns line up
     instead of each row right-justifying its own text. */
  .cb-cmp {
    display: grid; grid-template-columns: 1fr auto auto;
    gap: 2px 14px; align-items: baseline;
  }
  .cb-cmp .head { font-size: 9px; letter-spacing: 0.3px; text-align: right; }
  /* The column headings take their series' colours from the map: the dock
     layer's tone for Citibike, the own-bike tag's grey for the other. */
  .cb-cmp .head.cb { color: #a8d8e8; }
  .cb-cmp .head.own { color: #888; }
  .cb-cmp .label { color: #888; }
  .cb-cmp .v { color: #fff; text-align: right; font-variant-numeric: tabular-nums; }
  .cb-note { color: #777; font-size: 9px; line-height: 1.4; margin-top: 8px; }

  @media (max-width: 640px) {
    #stats-sections.open { max-height: min(240px, calc(100vh - 300px)); }
  }

  #legend {
    position: absolute; bottom: 28px; left: 12px; z-index: 1000;
    background: rgba(13, 13, 13, 0.88); color: #ccc; padding: 12px 16px;
    border-radius: 8px; font-size: 12px; border: 1px solid #333;
    backdrop-filter: blur(6px);
  }
  #legend .title { font-weight: 600; color: #fff; margin-bottom: 8px; }
  #legend .bar {
    width: 180px; height: 12px; border-radius: 3px; margin-bottom: 4px;
  }
  #legend .labels { display: flex; justify-content: space-between; font-size: 11px; color: #888; }
  #filter-row {
    display: none; align-items: center; gap: 8px; margin-top: 10px;
    font-size: 11px; color: #888;
  }
  #play-btn {
    background: #1a1a1a; color: #ccc; border: 1px solid #333; border-radius: 4px;
    width: 24px; height: 24px; font-size: 11px; cursor: pointer; flex: none;
    display: flex; align-items: center; justify-content: center;
  }
  #play-btn:hover { color: #fff; border-color: #555; }
  #slider { position: relative; width: 148px; height: 20px; flex: none; }
  #slider-track {
    position: absolute; top: 8px; left: 0; right: 0; height: 4px;
    background: #333; border-radius: 2px;
  }
  #slider-range {
    position: absolute; top: 8px; height: 4px; background: #999; border-radius: 2px;
  }
  #slider input[type=range] {
    position: absolute; left: 0; top: 0; width: 100%; height: 20px; margin: 0;
    -webkit-appearance: none; appearance: none; background: none; pointer-events: none;
  }
  #slider input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; pointer-events: auto; cursor: pointer;
    width: 13px; height: 13px; border-radius: 50%;
    background: #ddd; border: 1px solid #666;
  }
  #slider input[type=range]::-moz-range-thumb {
    pointer-events: auto; cursor: pointer;
    width: 11px; height: 11px; border-radius: 50%;
    background: #ddd; border: 1px solid #666;
  }
  #filter-dates {
    display: none; justify-content: space-between; margin-top: 4px;
    font-size: 10px; color: #888; font-variant-numeric: tabular-nums;
  }
  .ride-row { color: #9fd8ff; font-size: 12px; cursor: pointer; }
  .ride-row:hover { color: #fff; text-decoration: underline; }
  #ride-view-bar {
    display: none; position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 1000; background: rgba(13, 13, 13, 0.88); color: #ccc; padding: 8px 14px;
    border-radius: 8px; font-size: 12px; border: 1px solid #333;
    backdrop-filter: blur(6px); align-items: center; gap: 10px;
  }
  #ride-view-bar strong { color: #00e5ff; }
  #ride-view-exit {
    background: none; border: none; color: #888; font-size: 15px;
    line-height: 1; cursor: pointer; padding: 0 2px;
  }
  #ride-view-exit:hover { color: #fff; }

  .ride-popup .leaflet-popup-content-wrapper {
    background: rgba(13, 13, 13, 0.92); color: #fff; border-radius: 8px;
    border: 1px solid #444; backdrop-filter: blur(6px);
  }
  .ride-popup .leaflet-popup-tip { background: rgba(13, 13, 13, 0.92); }
  .ride-popup .leaflet-popup-close-button { color: #888; }
  .ride-popup .leaflet-popup-close-button:hover { color: #fff; }

  /* A popup opens on top of the very stretch of map it describes, so it gets
     a grab bar to move it aside. Only the bar drags: the rows under it are
     links and the list scrolls. The tip goes once the box has been moved,
     because it would be pointing at nothing. */
  .ride-popup .leaflet-popup-content { margin-top: 6px; }
  .popup-drag {
    height: 14px; display: flex; align-items: center; justify-content: center;
    cursor: grab; touch-action: none;
  }
  .popup-drag::before {
    content: ''; width: 26px; height: 3px; border-radius: 2px; background: #444;
  }
  .popup-drag:hover::before { background: #777; }
  .popup-drag.dragging { cursor: grabbing; }
  .popup-drag.dragging::before { background: #888; }
  .leaflet-popup.popup-moved .leaflet-popup-tip-container { display: none; }
</style>
</head>
<body>
<div id="map"></div>

<div id="ride-view-bar">
  <span>Ride <strong id="ride-view-label"></strong></span>
  <button id="ride-view-exit" title="Back to all rides (Esc)">&times;</button>
</div>

<div id="stats">
  <button id="stats-toggle" title="Collapse stats">&ndash;</button>
  <span id="stats-collapsed-label">Stats</span>
  <div id="stats-body">
    <div id="stat-hero">
      <div class="hero-tile"><strong id="stat-rides">&mdash;</strong><span class="label">rides</span></div>
      <div class="hero-tile hidden" id="tile-ridden"><strong id="stat-ridden">&mdash;</strong><span class="label">mi ridden</span></div>
      <div class="hero-tile" id="tile-km"><strong id="stat-km">&mdash;</strong><span class="label">unique street mi</span></div>
      <div class="hero-tile hidden" id="tile-coverage"><strong id="stat-coverage">&mdash;</strong><span class="label">of NYC</span></div>
    </div>
    <div id="stat-updated-row"><span class="label">Updated</span> <strong id="stat-updated">&mdash;</strong></div>
    <div id="stat-chips" role="group" aria-label="Stat sections">
      <button class="chip hidden" data-section="stat-years" aria-expanded="false" aria-controls="stat-years">Years</button>
      <button class="chip hidden" data-section="stat-riding" aria-expanded="false" aria-controls="stat-riding">Riding</button>
      <button class="chip hidden" data-section="stat-weather" aria-expanded="false" aria-controls="stat-weather">Weather</button>
      <button class="chip hidden" data-section="stat-streets" aria-expanded="false" aria-controls="stat-streets">Streets</button>
      <button class="chip hidden" data-section="stat-citibike" aria-expanded="false" aria-controls="stat-citibike">Citibike</button>
    </div>
    <div id="stats-sections">
      <div id="stat-years"></div>
      <div id="stat-riding"></div>
      <div id="stat-weather"></div>
      <div id="stat-streets">
        <div id="streets-totals"></div>
        <div id="speed-block">
          <div class="sub-title">Faster one way</div>
          <div id="speed-list"></div>
        </div>
      </div>
      <div id="stat-citibike"></div>
    </div>
  </div>
</div>

<div id="legend">
  <div class="title">Pass frequency</div>
  <div class="bar" id="legend-bar"></div>
  <div class="labels"><span>1</span><span id="legend-max">—</span></div>
  <div id="filter-row">
    <button id="play-btn" title="Play time-lapse">&#9654;</button>
    <div id="slider">
      <div id="slider-track"></div>
      <div id="slider-range"></div>
      <input type="range" id="range-lo" min="0" value="0" step="1">
      <input type="range" id="range-hi" min="0" value="0" step="1">
    </div>
  </div>
  <div id="filter-dates"><span id="date-lo"></span><span id="date-hi"></span></div>
  <!-- Most rides in the covered window turn out to be Citibike, so the
       interesting question is which ones were not. Revealed only when the
       payload knows the source of at least one ride. -->
  <div id="src-row" class="hidden">
    <button class="src-btn on" data-src="all">All</button>
    <button class="src-btn" data-src="citibike">Citibike</button>
    <button class="src-btn" data-src="own">Own bike</button>
  </div>
  <div id="src-note"></div>
  <!-- Revealed only when the payload carries a citibike block. Off by
       default: the map opens as the map of rides it has always been. -->
  <label id="cb-toggle" class="hidden">
    <input type="checkbox" id="cb-check"> Citibike docks
    <span id="cb-range"></span>
  </label>
</div>

<script>
const map = L.map('map', {
  center: [40.735, -73.96],
  zoom: 13,
  zoomControl: true,
  attributionControl: true,
  preferCanvas: true,
  renderer: L.canvas(),
});

// CARTO basemaps require a key as of Aug 2026 -- unauthenticated tiles come
// back stamped "API KEY REQUIRED". This is a free non-commercial basemap key
// (5M tiles/month). It is public by necessity: the browser sends it with every
// tile request. It reads public tiles only, and is rotatable if ever abused.
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png?key=cb1_2ew0_1_6d89edc1e55c801eab9bf900', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd',
  maxZoom: 19,
}).addTo(map);

// Plasma-style color stops (purple -> blue -> orange -> yellow)
const PLASMA = [
  [0.0,  [13, 8, 135]],
  [0.15, [74, 3, 168]],
  [0.3,  [131, 3, 163]],
  [0.45, [180, 34, 130]],
  [0.6,  [220, 75, 85]],
  [0.75, [246, 128, 38]],
  [0.9,  [252, 194, 2]],
  [1.0,  [240, 249, 33]],
];

function plasmaColor(t) {
  t = Math.max(0, Math.min(1, t));
  for (let i = 0; i < PLASMA.length - 1; i++) {
    const [t0, c0] = PLASMA[i];
    const [t1, c1] = PLASMA[i + 1];
    if (t <= t1) {
      const f = (t - t0) / (t1 - t0);
      const r = Math.round(c0[0] + f * (c1[0] - c0[0]));
      const g = Math.round(c0[1] + f * (c1[1] - c0[1]));
      const b = Math.round(c0[2] + f * (c1[2] - c0[2]));
      return `rgb(${r},${g},${b})`;
    }
  }
  const last = PLASMA[PLASMA.length - 1][1];
  return `rgb(${last[0]},${last[1]},${last[2]})`;
}

function buildGradientCSS() {
  const stops = PLASMA.map(([t, c]) => `rgb(${c[0]},${c[1]},${c[2]}) ${t * 100}%`);
  return `linear-gradient(to right, ${stops.join(', ')})`;
}
document.getElementById('legend-bar').style.background = buildGradientCSS();

// Collapsible stats panel (state persists across visits)
const statsEl = document.getElementById('stats');
const statsToggle = document.getElementById('stats-toggle');
function setStatsCollapsed(collapsed) {
  statsEl.classList.toggle('collapsed', collapsed);
  statsToggle.innerHTML = collapsed ? '+' : '&ndash;';
  statsToggle.title = collapsed ? 'Expand stats' : 'Collapse stats';
  try { localStorage.setItem('statsCollapsed', collapsed ? '1' : '0'); } catch (e) {}
}
statsToggle.addEventListener('click', () =>
  setStatsCollapsed(!statsEl.classList.contains('collapsed')));
try {
  if (localStorage.getItem('statsCollapsed') === '1') setStatsCollapsed(true);
} catch (e) {}

// -- Stat sections -----------------------------------------------------------
// One section open at a time.  The panel floats over the map, and stacking
// every section at once ran to ~32 rows and 670-1080px, which buried the map
// and gave the reader no idea where to look first.  The active chip doubles as
// the open section's heading, so the sections carry none of their own.
const sectionsEl = document.getElementById('stats-sections');
const chips = [...document.querySelectorAll('#stat-chips .chip[data-section]')];

// name === null closes everything.
function openSection(name) {
  for (const chip of chips) {
    const on = chip.dataset.section === name;
    chip.classList.toggle('active', on);
    chip.setAttribute('aria-expanded', String(on));
    document.getElementById(chip.dataset.section).classList.toggle('open', on);
  }
  sectionsEl.classList.toggle('open', name !== null);
  // The corridor ring belongs to the speed section; switching away without
  // clearing it strands a cyan circle on the map with nothing to explain it.
  if (name !== 'stat-streets') clearSpeedMarker();
  try { localStorage.setItem('statsSection', name || ''); } catch (e) {}
}

for (const chip of chips) {
  chip.addEventListener('click', () =>
    openSection(chip.classList.contains('active') ? null : chip.dataset.section));
}

// Chips start hidden and are revealed only once their data lands, so a partial
// payload leaves no dead chip -- the same progressive reveal the sections used
// to do with style.display, moved up a level.
function showChip(section) {
  document.querySelector(`#stat-chips .chip[data-section="${section}"]`)
    .classList.remove('hidden');
}

// Reopen last visit's section, but only if this payload actually has it.
function restoreSection() {
  let name = null;
  try { name = localStorage.getItem('statsSection'); } catch (e) {}
  const chip = chips.find(c => c.dataset.section === name);
  if (chip && !chip.classList.contains('hidden')) openSection(name);
}

// Each feature's properties.rides holds indices into the global rideList
// ([dateIndex, "HH:MM"] per ride); [filterLo, filterHi] selects the active
// date-index range.  One entry per traversal, so a ride that crossed the
// segment twice appears twice and the array length is passes, not rides.
// The array stays sorted (equal rides have equal indices), so hasRide's
// binary search is unaffected.
// Pipeline data is metric; convert to miles for display only.
const KM_TO_MI = 0.621371;
const mi = km => km * KM_TO_MI;

let dateList = [];
let rideList = [];
let rideDateIdx = [];
// Fourth element of a ride row: -1 unknown (outside the Citibike export's
// window), 0 own bike, n>=1 the number of Citibike trips it overlaps.
let rideSrc = [];
let sourceFilter = 'all';

// An unknown ride belongs to neither side. It is not evidence of an own-bike
// ride -- outside the export's window there is no evidence at all -- so it is
// hidden by both filters rather than lumped in with one.
function sourceMatches(ri) {
  if (sourceFilter === 'all') return true;
  const s = rideSrc[ri];
  return sourceFilter === 'citibike' ? s > 0 : s === 0;
}

// Spelt out rather than "Citibike ×2": a popup row already carries a "×2"
// for its pass count, and two different multipliers side by side read as one.
function sourceTag(ri) {
  const s = rideSrc[ri];
  if (s > 1) return `<span class="src-tag cb">${s} Citibike trips</span>`;
  if (s === 1) return '<span class="src-tag cb">Citibike</span>';
  if (s === 0) return '<span class="src-tag own">own bike</span>';
  return '';
}
let newKmByYear = {};
let filterLo = 0;
let filterHi = Infinity;
let sqrtMax = 1;
let fullMaxCount = 1;
let geoLayer = null;
let rideView = null;

// Passes in range; the array repeats a ride once per traversal.
function countInRange(rideIds) {
  if (filterLo === 0 && filterHi === Infinity && sourceFilter === 'all') return rideIds.length;
  let n = 0;
  for (const ri of rideIds) {
    const di = rideDateIdx[ri];
    if (di >= filterLo && di <= filterHi && sourceMatches(ri)) n++;
  }
  return n;
}

// rideIds arrays are sorted; binary search for membership
function hasRide(arr, id) {
  let lo = 0, hi = arr.length - 1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (arr[mid] === id) return true;
    if (arr[mid] < id) lo = mid + 1; else hi = mid - 1;
  }
  return false;
}

// -- Coverage exclusions -----------------------------------------------------
// The coverage denominator drops config.COVERAGE_EXCLUDE, and saying which
// from memory is how the caption came to claim paths were excluded when
// sidewalks are.  The export ships the categories with their length instead,
// so editing that set updates the wording; an unmapped tag renders as itself
// rather than disappearing.

const HW_LABELS = {
  footway: 'sidewalks', service: 'service roads', motorway: 'motorways',
  motorway_link: 'motorway ramps', steps: 'steps', pedestrian: 'pedestrian streets',
  corridor: 'indoor corridors', elevator: 'elevators', escalator: 'escalators',
  construction: 'closed ways', proposed: 'proposed ways',
};

function excludedLabel(coverage, n = 3) {
  const names = Object.keys(coverage?.excluded_km || {})
    .slice(0, n)  // already sorted longest-first by the export
    .map(hw => HW_LABELS[hw] || hw.replace(/_/g, ' '));
  if (!names.length) return '';
  const last = names.pop();
  return names.length ? `${names.join(', ')} and ${last} excluded` : `${last} excluded`;
}

// -- Direction-split speed ---------------------------------------------------
// Ranked in the pipeline (edge_speed._top_corridors), not here: naming a
// corridor needs the OSM street names, which never reach the browser.  Each
// row is one stretch that agrees on which way is faster, so a bridge appears
// twice -- its two descents -- rather than averaging itself to nothing.

let speedMarker = null;
let speedRow = null;

function clearSpeedMarker() {
  if (speedMarker) { map.removeLayer(speedMarker); speedMarker = null; }
  if (speedRow) { speedRow.classList.remove('on'); speedRow = null; }
}

function showCorridor(c, row) {
  clearSpeedMarker();
  const [lon, lat] = c.at;
  speedMarker = L.circleMarker([lat, lon], {
    radius: 9, color: '#00e5ff', weight: 2, fill: false, interactive: false,
  }).addTo(map);
  speedRow = row;
  row.classList.add('on');
  map.flyTo([lat, lon], Math.max(map.getZoom(), 15), { duration: 0.6 });
}

// A second click on the row already circled takes the circle back off, so the
// row that placed it can also remove it. Clicking a different row moves it.
function toggleCorridor(c, row) {
  if (speedRow === row) clearSpeedMarker();
  else showCorridor(c, row);
}

function renderStreets(props) {
  const rows = [];
  if (props.total_km != null) {
    rows.push(['Drawn', `${Math.round(mi(props.total_km)).toLocaleString()} mi`]);
  }
  if (props.total_edges != null) {
    rows.push(['Segments', props.total_edges.toLocaleString()]);
  }
  const cov = props.coverage;
  if (cov) {
    // Only the percentage is shown. Its numerator is the drawn miles minus
    // the excluded tags -- a smaller number nobody actually rode, which read
    // as contradicting the Drawn row directly above it. The exclusions are
    // what "rideable" means here, so those stay; the mileage does not.
    rows.push(['Of rideable NYC', `${cov.pct}%`, excludedLabel(cov) || null]);
  }
  const top = props.top_segment;
  if (props.max_count != null) {
    // The count alone says how often without saying what. The name is only
    // available because export.py carries it through the merge -- OSM street
    // names reach the browser for nothing else.
    rows.push(['Most-ridden segment', `${props.max_count.toLocaleString()}\u00d7`,
      top && top.name ? '<span class="r-link"></span>' : null]);
  }
  if (!rows.length) return;
  const totals = document.getElementById('streets-totals');
  totals.innerHTML =
    `<div class="sub-title">Network</div>` +
    rows.map(([k, v, sub]) =>
      `<div class="r-row"><span class="label">${k}</span><strong>${v}</strong></div>` +
      (sub ? `<div class="r-sub">${sub}</div>` : '')).join('');
  const link = totals.querySelector('.r-link');
  if (link) {
    link.textContent = top.name;  // textContent, not innerHTML: this is OSM data
    link.addEventListener('click', () => toggleCorridor(top, link));
  }
  showChip('stat-streets');
}

function renderSpeedSplits(speed) {
  if (!speed || !speed.corridors || !speed.corridors.length) return;
  const list = document.getElementById('speed-list');
  list.innerHTML = '';
  for (const c of speed.corridors) {
    const row = document.createElement('div');
    row.className = 'sp-row';
    row.innerHTML =
      `<span class="sp-name" title="${c.name}">${c.name}</span>` +
      `<span class="sp-dir">${c.dir}</span>` +
      `<span class="sp-gap">${mi(c.gap).toFixed(1)}</span>`;
    const detail = document.createElement('div');
    detail.className = 'sp-detail';
    detail.textContent =
      `${mi(c.fast).toFixed(1)} vs ${mi(c.slow).toFixed(1)} mph over ` +
      `${(mi(c.m / 1000)).toFixed(2)} mi, ${c.n}+ passes each way`;
    row.addEventListener('click', () => toggleCorridor(c, row));
    list.appendChild(row);
    list.appendChild(detail);
  }
  const lead = document.createElement('div');
  lead.id = 'speed-lead';
  lead.textContent =
    `The mph gap between the two directions of travel, from ride timestamps. ` +
    `Of ${speed.measured.toLocaleString()} stretches measured ` +
    `(${Math.round(mi(speed.min_m / 1000) * 5280)} ft+, ridden ${speed.split_n}+ ` +
    `times each way), these have the widest gaps.`;
  list.prepend(lead);
  document.getElementById('speed-block').style.display = 'block';
  showChip('stat-streets');
}

// -- Citibike ---------------------------------------------------------------
// A second, weaker kind of evidence, drawn as its own layer and never as
// routes.  These trips are dock-to-dock with no GPS trace, so what happened
// between two docks is unknown and nothing here contributes to the drawn
// edges, their pass counts, or the coverage percentage.  What is exact is
// where a trip began, where it ended, and when -- so the layer is built to be
// explored against the ride heatmap rather than to state a finding: markers
// resize with the same date slider that filters the edges, and a dock's own
// trips are drawn only when someone clicks it and asks.
//
// Docks are a cool pale tone deliberately outside the plasma ramp, which
// means pass frequency; size carries dock volume, so no second colour scale
// competes with the first.  Cyan is the page's existing selection colour.
const DOCK_COLOR = '#a8d8e8';
const DOCK_SELECTED = '#00e5ff';
const DOCK_R_MIN = 2.5;
const DOCK_R_MAX = 13;

let cbData = null;
let dockLayer = null;      // markers with at least one trip in the date range
let dockLinks = null;      // the selected dock's trips, drawn on demand
let dockMarkers = [];      // index-aligned with cbData.docks
let dockTrips = [];        // dock index -> indices into cbData.trips
let dockSelected = null;   // dock index whose trips are drawn, if any
let dockSqrtMax = 1;

// The two sources share dates but not days: 32 of the Citibike days have no
// own-bike ride, so there is no joint index to slide over.  Joining on the
// ISO date string itself is exact and needs nothing precomputed.
function dockDateBounds() {
  const lo = dateList[filterLo] ?? '0000-00-00';
  const hi = filterHi === Infinity ? '9999-99-99' : (dateList[filterHi] ?? '9999-99-99');
  return [lo, hi];
}

function dockUseInRange(di, lo, hi) {
  let out = 0, into = 0;
  for (const ti of dockTrips[di]) {
    const [a, b, d] = cbData.trips[ti];
    const day = cbData.days[d];
    if (day < lo || day > hi) continue;
    // A trip that started and ended here counts once each way, as it should.
    if (a === di) out++;
    if (b === di) into++;
  }
  return [out, into];
}

// Where the selected dock's trips went, in range, busiest first.
function dockPartners(di, lo, hi) {
  const seen = new Map();
  for (const ti of dockTrips[di]) {
    const [a, b, d] = cbData.trips[ti];
    if (cbData.days[d] < lo || cbData.days[d] > hi) continue;
    const other = a === di ? b : a;
    if (other === di) continue;  // an unlock re-docked where it started
    const rec = seen.get(other) || { out: 0, into: 0 };
    if (a === di) rec.out++; else rec.into++;
    seen.set(other, rec);
  }
  return [...seen.entries()]
    .map(([idx, r]) => ({ idx, ...r, n: r.out + r.into }))
    .sort((x, y) => y.n - x.n);
}

function clearDockLinks() {
  if (dockLinks) { map.removeLayer(dockLinks); dockLinks = null; }
  const m = dockSelected === null ? null : dockMarkers[dockSelected];
  if (m) m.setStyle({ fillColor: DOCK_COLOR });
  dockSelected = null;
}

// Straight dock-to-dock, and only for the one dock a reader asked about.
// A straight line cannot be mistaken for a claim about which streets the
// trip used, and drawn on demand it answers a question instead of asserting
// a shape over the whole city.
function showDockLinks(di) {
  clearDockLinks();
  const [lo, hi] = dockDateBounds();
  const from = cbData.docks[di];
  if (!from.at) return;
  dockLinks = L.layerGroup();
  for (const p of dockPartners(di, lo, hi)) {
    const to = cbData.docks[p.idx];
    if (!to.at) continue;
    L.polyline([[from.at[1], from.at[0]], [to.at[1], to.at[0]]], {
      color: DOCK_SELECTED, weight: Math.min(4, 1 + p.n * 0.6),
      opacity: 0.55, interactive: false,
    }).addTo(dockLinks);
  }
  dockLinks.addTo(map);
  dockSelected = di;
  const m = dockMarkers[di];
  if (m) { m.setStyle({ fillColor: DOCK_SELECTED }); m.bringToFront(); }
}

// Hop from one dock to the next through the trips that connect them: a
// popup's rows are the map's own links, so a reader can follow a route
// through their own history rather than hunting for the next marker.
function focusDock(di) {
  const m = dockMarkers[di];
  if (m && dockLayer.hasLayer(m)) m.openPopup();  // auto-pans if off screen
}

// Built as DOM, not an HTML string: dock names are Lyft data and half of
// them contain an ampersand, which has no business being interpolated into
// markup. It also lets the rows carry real listeners instead of inline
// handlers.
function dockPopup(di) {
  const [lo, hi] = dockDateBounds();
  const d = cbData.docks[di];
  const [out, into] = dockUseInRange(di, lo, hi);
  const partners = dockPartners(di, lo, hi);

  const box = document.createElement('div');
  box.className = 'dock-popup';

  const head = document.createElement('div');
  head.className = 'dock-head';
  head.textContent = d.name;
  const sub = document.createElement('div');
  sub.className = 'dock-sub';
  sub.textContent =
    `${out + into} trip${out + into !== 1 ? 's' : ''} \u00b7 ${out} out / ${into} in` +
    (partners.length ? ` \u00b7 ${partners.length} dock${partners.length !== 1 ? 's' : ''} reached` : '');
  box.append(head, sub);

  for (const p of partners) {
    const other = cbData.docks[p.idx];
    const row = document.createElement('div');
    const name = document.createElement('span');
    name.textContent = other.name;
    const counts = document.createElement('span');
    counts.className = 'dock-count';
    counts.textContent =
      (p.out ? ` \u2192${p.out}` : '') + (p.into ? ` \u2190${p.into}` : '');
    row.append(name, counts);
    // Only a dock that can be drawn is worth offering as a link -- one GBFS
    // could not place has nowhere to jump to, so it must not look clickable.
    if (other.at) {
      row.className = 'ride-row';
      row.title = `Show ${other.name}`;
      row.addEventListener('click', () => focusDock(p.idx));
    } else {
      row.className = 'dock-row-flat';
      row.title = 'No coordinates for this dock';
    }
    box.appendChild(row);
  }
  return box;
}

// Mirrors applyFilter's own renormalise/freeze: the slider rescales to what
// is in range, playback holds the full-history scale so docks grow.
function applyDockFilter(renormalize = true) {
  // Nothing to resize while the layer is off; the toggle refreshes it on the
  // way back in, so skipping here cannot leave a stale radius on screen.
  if (!dockLayer || !cbData || !map.hasLayer(dockLayer)) return;
  const [lo, hi] = dockDateBounds();
  let maxUse = 1;
  for (let i = 0; i < dockMarkers.length; i++) {
    const m = dockMarkers[i];
    if (!m) continue;
    const [out, into] = dockUseInRange(i, lo, hi);
    m._use = out + into;
    if (m._use > maxUse) maxUse = m._use;
  }
  if (renormalize) dockSqrtMax = Math.sqrt(maxUse);
  for (const m of dockMarkers) {
    if (!m) continue;
    if (m._use === 0) {
      dockLayer.removeLayer(m);
      continue;
    }
    const t = Math.min(1, Math.sqrt(m._use) / dockSqrtMax);
    m.setRadius(DOCK_R_MIN + (DOCK_R_MAX - DOCK_R_MIN) * t);
    if (!dockLayer.hasLayer(m)) dockLayer.addLayer(m);
  }
  // The selected dock's partners depend on the range too, so redraw them.
  if (dockSelected !== null) showDockLinks(dockSelected);
}

function buildDockLayer() {
  dockLayer = L.layerGroup();
  dockMarkers = cbData.docks.map((d, i) => {
    if (!d.at) return null;  // a dock GBFS no longer lists; it still counts
    const m = L.circleMarker([d.at[1], d.at[0]], {
      radius: DOCK_R_MIN, fillColor: DOCK_COLOR, fillOpacity: 0.8,
      // A ring in the basemap's own dark keeps a dock legible where it lands
      // on top of a bright plasma segment.
      color: '#0d0d0d', weight: 1.5,
    });
    m.bindTooltip(() => {
      const [lo, hi] = dockDateBounds();
      const [out, into] = dockUseInRange(i, lo, hi);
      return `${d.name}<br>${out + into} trips (${out} out / ${into} in)`;
    }, { sticky: true });
    m.bindPopup(() => dockPopup(i), { className: 'ride-popup' });
    m.on('popupopen', () => showDockLinks(i));
    m.on('popupclose', clearDockLinks);
    return m;
  });
}

function initDockLayer(cb) {
  if (!cb || !cb.docks?.some(d => d.at)) return;
  cbData = cb;
  dockTrips = cb.docks.map(() => []);
  cb.trips.forEach(([a, b], ti) => {
    dockTrips[a].push(ti);
    if (b !== a) dockTrips[b].push(ti);
  });
  buildDockLayer();
  const toggle = document.getElementById('cb-toggle');
  const check = document.getElementById('cb-check');
  const month = (iso) => new Date(`${iso}T12:00:00`).toLocaleDateString('en-US',
    { month: 'short', year: 'numeric' });
  // Only worth saying when the docks start after the rides do; if they cover
  // the whole history there is no stretch of empty slider to explain.
  const startsLate = cb.from && dateList.length && cb.from > dateList[0];
  document.getElementById('cb-range').textContent =
    startsLate ? `(${month(cb.from)} on)` : '';
  toggle.classList.remove('hidden');
  check.addEventListener('change', () => {
    if (check.checked) {
      // On the map first: applyDockFilter is a no-op while the layer is off,
      // so filtering before adding would leave an empty group.
      dockLayer.addTo(map);
      applyDockFilter();
    } else {
      clearDockLinks();
      map.closePopup();
      map.removeLayer(dockLayer);
    }
  });
}

function renderCitibike(cb) {
  if (!cb || !cb.trips?.length) return;
  const own = cb.own || {};
  const n = (v) => (v == null ? '\u2014' : v.toLocaleString());
  // Two complete records of different kinds, side by side: every Citibike
  // trip against every recorded ride no Citibike trip was found under. One
  // GPS recording can hold several Citibike trips, but never several
  // own-bike ones, so "trips" counts honestly in both columns.
  const rows = [
    ['Trips', n(cb.trips.length), n(own.rides)],
    ['Time', `${n(Math.round(cb.hours))} h`, `${n(Math.round(own.hours))} h`],
    ['Days out', n(cb.days.length), n(own.days)],
    // Whole minutes: Lyft's own durations are, and a median to a tenth of
    // a minute claims a precision neither side has.
    ['Typical', `${n(Math.round(cb.median_min))} min`,
      own.median_min == null ? '\u2014' : `${n(Math.round(own.median_min))} min`],
  ];
  document.getElementById('stat-citibike').innerHTML =
    `<div class="cb-cmp">` +
    `<span></span><span class="head cb">Citibike</span><span class="head own">Own bike</span>` +
    rows.map(([k, a, b]) =>
      `<span class="label">${k}</span><span class="v">${a}</span><span class="v">${b}</span>`
    ).join('') +
    `</div>` +
    `<div class="cb-note">${cb.aborted.toLocaleString()} unlocks re-docked within 2 min ` +
    `\u00b7 ${cb.repeat_bikes.toLocaleString()} of ${cb.bikes.toLocaleString()} bikes ridden ` +
    `more than once \u00b7 at least ${cb.ebike_min.toLocaleString()} ebike trips ` +
    `\u00b7 $${cb.paid.toFixed(2)} paid of $${cb.charged.toFixed(2)} charged</div>`;
  showChip('stat-citibike');
}

function styleFor(count) {
  const t = Math.sqrt(count) / sqrtMax;
  return {
    color: plasmaColor(t),
    weight: 1.5 + t * 4,
    opacity: 0.85,
    lineJoin: 'round',
    lineCap: 'round',
  };
}

// The ids repeat once per traversal, so a ride that came back this way gets
// one row marked x2 rather than two identical rows. The header carries both
// numbers: the count on the map is passes, but the rows below are rides.
function popupContent(rideIds) {
  const rows = [];
  let passes = 0;
  for (let i = 0; i < rideIds.length; i++) {
    const ri = rideIds[i];
    const di = rideDateIdx[ri];
    if (di < filterLo || di > filterHi || !sourceMatches(ri)) continue;
    let n = 1;
    while (i + 1 < rideIds.length && rideIds[i + 1] === ri) { n++; i++; }
    passes += n;
    const d = dateList[di] ?? '';
    const t = rideList[ri]?.[1] || '';
    rows.push(
      `<div class="ride-row" onclick="viewRide(${ri})" title="Show this ride's route">` +
      `${d}${t ? ` &middot; ${t}` : ''}${n > 1 ? ` &times;${n}` : ''}` +
      `${sourceTag(ri) ? ` &middot; ${sourceTag(ri)}` : ''}</div>`
    );
  }
  const header = `<strong>${passes} pass${passes !== 1 ? 'es' : ''}</strong>` +
    (passes !== rows.length ? ` across ${rows.length} ride${rows.length !== 1 ? 's' : ''}` : '');
  return `<div style="max-height:200px;overflow-y:auto">${header}${rows.join('')}</div>`;
}

// -- Draggable popups --------------------------------------------------------
// A popup covers the feature it describes, which is often exactly what the
// reader wants to look at while reading it. The grab bar moves the box
// without letting go of that feature: the drag is a margin applied on top of
// Leaflet's own positioning, which Leaflet never writes, so a moved popup
// still pans and zooms with its street or dock.

const POPUP_EDGE = 8;  // px of the popup that has to stay on the map

// The offset now applied to a popup, in px right and down of where Leaflet
// put it.
function popupOffset(container) {
  return [
    parseFloat(container.style.marginLeft) || 0,
    -(parseFloat(container.style.marginBottom) || 0),
  ];
}

function setPopupOffset(container, dx, dy) {
  container.style.marginLeft = `${dx}px`;
  container.style.marginBottom = `${-dy}px`;
  container.classList.toggle('popup-moved', dx !== 0 || dy !== 0);
}

function dragPopupFrom(e, container, bar) {
  if (e.button !== 0) return;
  e.preventDefault();  // no text selection, and no map drag underneath
  const [dx0, dy0] = popupOffset(container);
  const box = container.getBoundingClientRect();
  const view = map.getContainer().getBoundingClientRect();
  // Clamped as bounds on the offset, measured from where Leaflet would put
  // the box (its current rect less the offset already on it), so a popup can
  // never be dragged out of reach: a corner of it stays on the map, and the
  // bar that moves it stays with it.
  const minX = view.left + POPUP_EDGE - (box.right - dx0);
  const maxX = view.right - POPUP_EDGE - (box.left - dx0);
  const minY = view.top + POPUP_EDGE - (box.top - dy0);
  const maxY = view.bottom - POPUP_EDGE - bar.offsetHeight - (box.top - dy0);
  const x0 = e.clientX, y0 = e.clientY;

  const move = ev => setPopupOffset(
    container,
    Math.min(maxX, Math.max(minX, dx0 + ev.clientX - x0)),
    Math.min(maxY, Math.max(minY, dy0 + ev.clientY - y0)),
  );
  const stop = () => {
    bar.classList.remove('dragging');
    bar.removeEventListener('pointermove', move);
    bar.removeEventListener('pointerup', stop);
    bar.removeEventListener('pointercancel', stop);
  };
  bar.setPointerCapture(e.pointerId);
  bar.classList.add('dragging');
  bar.addEventListener('pointermove', move);
  bar.addEventListener('pointerup', stop);
  bar.addEventListener('pointercancel', stop);
}

// Leaflet rebuilds a popup's content on every open but keeps its container,
// so the bar is added once and the offset is cleared every time: where one
// dock's popup was dragged to is off screen for the next one.
map.on('popupopen', e => {
  const container = e.popup.getElement();
  const wrapper = container?.querySelector('.leaflet-popup-content-wrapper');
  if (!wrapper) return;
  setPopupOffset(container, 0, 0);
  if (wrapper.querySelector('.popup-drag')) return;
  const bar = document.createElement('div');
  bar.className = 'popup-drag';
  bar.title = 'Drag to move';
  bar.addEventListener('pointerdown', ev => dragPopupFrom(ev, container, bar));
  wrapper.insertBefore(bar, wrapper.firstChild);
});

// -- Single-ride view --------------------------------------------------------

function viewRide(ri) {
  rideView = ri;
  map.closePopup();
  const d = dateList[rideDateIdx[ri]] ?? '';
  const t = rideList[ri]?.[1] || '';
  const label = document.getElementById('ride-view-label');
  label.innerHTML = `${t ? `${d} ${t}` : d}` +
    `${sourceTag(ri) ? ` &middot; ${sourceTag(ri)}` : ''}`;
  document.getElementById('ride-view-bar').style.display = 'flex';
  const on = [];
  geoLayer.eachLayer(layer => {
    const ids = layer.feature.properties.rides || [];
    const isOn = hasRide(ids, ri);
    if (!map.hasLayer(layer)) {
      if (!isOn) return;
      layer.addTo(map);  // show the full ride even outside the date filter
    }
    if (isOn) {
      layer.setStyle({ color: '#00e5ff', weight: 4, opacity: 0.95, lineJoin: 'round', lineCap: 'round' });
      on.push(layer);
    } else {
      layer.setStyle({ color: '#555', weight: 1, opacity: 0.12 });
    }
  });
  for (const l of on) l.bringToFront();
  syncYearLinks();
}

function exitRideView() {
  if (rideView === null) return;
  rideView = null;
  document.getElementById('ride-view-bar').style.display = 'none';
  syncYearLinks();
  applyFilter();
}

// A second click on the ride already being shown puts the map back, so the
// link that selected it can also clear it.
function toggleRide(ri) {
  if (rideView === ri) exitRideView();
  else viewRide(ri);
}

// Ride view is also left by Escape, the exit button and the date filter, so
// the link's selected state is synced from rideView rather than set on click.
function syncYearLinks() {
  for (const link of document.querySelectorAll('#stat-years .yd-link')) {
    const on = rideView !== null && +link.dataset.ride === rideView;
    link.classList.toggle('on', on);
    link.title = on ? 'Hide this ride' : "Show this ride's route";
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') exitRideView();
});
document.getElementById('ride-view-exit').addEventListener('click', exitRideView);

// -- Per-year table --------------------------------------------------------
// Each row expands into the recap that used to be a separate modal.  The
// table already carried rides/miles/new-miles per year, so the modal was
// mostly a second rendering of this data one year at a time; what only it
// had -- the year-over-year deltas, longest ride, biggest month, favourite
// time -- is now the row's detail.

const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July',
                'August', 'September', 'October', 'November', 'December'];
const WEEKDAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

function yearRecap(year) {
  const prevYear = String(+year - 1);
  const cur = { n: 0, km: 0, longest: null, months: {}, wd: new Array(7).fill(0),
                hours: new Array(24).fill(0) };
  let prevN = 0, prevKm = 0;
  rideList.forEach((r, i) => {
    const d = dateList[r[0]] || '';
    if (d.startsWith(prevYear)) { prevN++; prevKm += r[2] || 0; return; }
    if (!d.startsWith(year)) return;
    cur.n++;
    cur.km += r[2] || 0;
    if (r[2] != null && (!cur.longest || r[2] > cur.longest.km)) {
      cur.longest = { id: i, km: r[2], date: d };
    }
    const m = +d.slice(5, 7) - 1;
    cur.months[m] = (cur.months[m] || 0) + 1;
    cur.wd[new Date(d + 'T12:00:00').getDay()]++;
    if (r[1]) cur.hours[+r[1].slice(0, 2)]++;
  });
  return { cur, prevN, prevKm };
}

function fmtDelta(cur, prev) {
  if (!prev) return '';
  const pct = Math.round(100 * (cur - prev) / prev);
  const cls = pct < 0 ? 'delta neg' : 'delta';
  return `<span class="${cls}">${pct >= 0 ? '+' : ''}${pct}%</span>`;
}

const hourLabel = h =>
  h === 0 ? '12am' : h < 12 ? `${h}am` : h === 12 ? '12pm' : `${h - 12}pm`;

function yearDetail(year) {
  const { cur, prevN, prevKm } = yearRecap(year);
  if (!cur.n) return '';
  let bigM = null;
  for (const m in cur.months) if (bigM === null || cur.months[m] > cur.months[bigM]) bigM = m;
  const topWd = cur.wd.indexOf(Math.max(...cur.wd));
  const topH = cur.hours.indexOf(Math.max(...cur.hours));
  const dN = fmtDelta(cur.n, prevN);
  const dKm = cur.km ? fmtDelta(cur.km, prevKm) : '';
  const rows = [
    cur.longest ? ['Longest ride',
      `<span class="yd-link" data-ride="${cur.longest.id}"` +
      ` title="Show this ride's route">${cur.longest.date} &middot; ` +
      `${Math.round(mi(cur.longest.km))} mi</span>`] : null,
    bigM !== null ? ['Biggest month', `${MONTHS[bigM]} &middot; ${cur.months[bigM]} rides`] : null,
    ['Favourite time', `${WEEKDAYS[topWd]}s &middot; ${hourLabel(topH)}`],
  ].filter(Boolean);
  const vs = (dN || dKm)
    ? `<div class="yd-vs">vs ${+year - 1}: ${[dN && `${dN} rides`, dKm && `${dKm} mi`]
        .filter(Boolean).join(' &middot; ')}</div>`
    : '';
  return vs + rows
    .map(([k, v]) => `<div class="yd-row"><span>${k}</span><span class="v">${v}</span></div>`)
    .join('');
}

function renderYears(ridesPerYear, kmByYear, newByYear) {
  const el = document.getElementById('stat-years');
  el.innerHTML =
    `<div class="year-head"><span></span><span class="y-year"></span>` +
    `<span>Rides</span><span>Miles</span><span>New mi</span></div>` +
    Object.entries(ridesPerYear).map(([y, n]) => {
      const km = kmByYear[y] != null ? Math.round(mi(kmByYear[y])).toLocaleString() : '';
      const nw = newByYear[y] != null ? `+${Math.round(mi(newByYear[y]))}` : '';
      return `<div class="year-row" data-year="${y}" role="button" tabindex="0"` +
        ` aria-expanded="false" title="${y} in detail">` +
        `<span class="y-caret">&#9656;</span><span class="y-year">${y}</span>` +
        `<span class="y-n">${n.toLocaleString()}</span>` +
        `<span class="y-mi">${km}</span><span class="y-new">${nw}</span></div>` +
        `<div class="year-detail" data-year="${y}"></div>`;
    }).join('');

  el.addEventListener('click', e => {
    const link = e.target.closest('.yd-link');
    if (link) toggleRide(+link.dataset.ride);
  });

  // Detail is computed on first open: yearRecap walks all 1380 rides, and
  // most years are never expanded.
  for (const row of el.querySelectorAll('.year-row')) {
    const open = () => {
      const year = row.dataset.year;
      const detail = row.nextElementSibling;
      const on = !row.classList.contains('open');
      if (on && !detail.innerHTML) detail.innerHTML = yearDetail(year);
      row.classList.toggle('open', on);
      row.setAttribute('aria-expanded', String(on));
      row.querySelector('.y-caret').innerHTML = on ? '&#9662;' : '&#9656;';
    };
    row.addEventListener('click', open);
    row.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
    });
  }
  showChip('stat-years');
}

// renormalize=true rescales colors to the filtered max and restyles every
// layer; renormalize=false keeps the current scale and only restyles layers
// whose count changed (cheap enough to run every animation frame).
function applyFilter(renormalize = true) {
  let filteredMax = 1;
  geoLayer.eachLayer(layer => {
    const c = countInRange(layer.feature.properties.rides || []);
    layer._newCount = c;
    if (c > filteredMax) filteredMax = c;
  });
  if (renormalize) {
    sqrtMax = Math.sqrt(filteredMax);
    document.getElementById('legend-max').textContent = filteredMax;
  }
  applyDockFilter(renormalize);
  geoLayer.eachLayer(layer => {
    const c = layer._newCount;
    if (!renormalize && c === layer._filteredCount) return;
    layer._filteredCount = c;
    if (c === 0) {
      map.removeLayer(layer);
    } else {
      if (!map.hasLayer(layer)) layer.addTo(map);
      layer.setStyle(styleFor(c));
    }
  });
  restackLayers();
}

// Restack visible lines so frequent (bright) edges draw above rare (dark)
// ones -- remove/re-add during filtering otherwise scrambles the initial
// count-sorted order. Runs on every filter change (including each playback
// frame, where re-added streets land on top and growing counts reorder
// lines): sort + bringToFront are cheap linked-list moves on canvas,
// small next to the full redraw each frame already triggers.
function restackLayers() {
  const visible = [];
  geoLayer.eachLayer(l => { if (l._filteredCount > 0) visible.push(l); });
  visible.sort((a, b) => a._filteredCount - b._filteredCount);
  for (const l of visible) l.bringToFront();
  // The edges above draw into the same canvas as the dock markers, so a
  // filter change would otherwise bury the dock layer under them.
  if (dockLayer && map.hasLayer(dockLayer)) {
    dockLayer.eachLayer(l => l.bringToFront());
    if (dockLinks) dockLinks.eachLayer(l => l.bringToFront());
  }
}

// -- Date-range slider + time-lapse playback --------------------------------

const PLAY_DURATION_MS = 25000;
let playing = false;

// Shown only when the payload can say something: with no Citibike export
// every ride is unknown and the control would offer two empty views.
function initSourceFilter() {
  if (!rideSrc.some(s => s >= 0)) return;
  const row = document.getElementById('src-row');
  const note = document.getElementById('src-note');
  const known = rideSrc.filter(s => s >= 0).length;
  const buttons = [...row.querySelectorAll('.src-btn')];
  row.classList.remove('hidden');
  for (const btn of buttons) {
    btn.addEventListener('click', () => {
      sourceFilter = btn.dataset.src;
      for (const b of buttons) b.classList.toggle('on', b === btn);
      // Say what is being left out, but only when something is. Once the
      // Citibike history covers every ride there is nothing to disclaim, and
      // a note reading "0 rides are hidden" is worse than no note.
      const hidden = rideList.length - known;
      note.textContent = (sourceFilter === 'all' || !hidden) ? '' :
        (hidden === 1
          ? '1 ride falls outside the Citibike history, so its source is unknown and it is hidden.'
          : `${hidden.toLocaleString()} rides fall outside the Citibike history, ` +
            'so their source is unknown and they are hidden.');
      exitRideView();
      applyFilter();
    });
  }
}

function initDateFilter() {
  if (dateList.length < 2) return;
  const last = dateList.length - 1;
  const lo = document.getElementById('range-lo');
  const hi = document.getElementById('range-hi');
  const btn = document.getElementById('play-btn');
  lo.max = last;
  hi.max = last;
  lo.value = 0;
  hi.value = last;

  function updateUI() {
    const a = +lo.value;
    const b = +hi.value;
    document.getElementById('date-lo').textContent = dateList[a];
    document.getElementById('date-hi').textContent = dateList[b];
    const bar = document.getElementById('slider-range');
    bar.style.left = `${(a / last) * 100}%`;
    bar.style.width = `${((b - a) / last) * 100}%`;
  }

  let pending = false;
  let fromPlayback = false;
  function onInput(moved) {
    if (fromPlayback) return;
    exitRideView();
    if (playing) stopPlay();
    // Keep handles ordered by pushing the one that was not moved
    if (+lo.value > +hi.value) {
      if (moved === lo) hi.value = lo.value;
      else lo.value = hi.value;
    }
    filterLo = +lo.value;
    filterHi = +hi.value === last ? Infinity : +hi.value;
    updateUI();
    if (!pending) {
      pending = true;
      requestAnimationFrame(() => {
        pending = false;
        applyFilter();
      });
    }
  }
  lo.addEventListener('input', () => onInput(lo));
  hi.addEventListener('input', () => onInput(hi));

  let playRAF = null;
  function stopPlay() {
    playing = false;
    if (playRAF) cancelAnimationFrame(playRAF);
    btn.innerHTML = '&#9654;';
    applyFilter();  // renormalize to wherever playback stopped
  }

  function startPlay() {
    exitRideView();
    playing = true;
    btn.innerHTML = '&#10074;&#10074;';
    // Freeze the color scale at the full-history max so streets deepen in
    // color as they accumulate rides, instead of renormalizing every frame.
    sqrtMax = Math.sqrt(fullMaxCount);
    document.getElementById('legend-max').textContent = fullMaxCount;
    fromPlayback = true;
    lo.value = 0;
    fromPlayback = false;
    const t0 = performance.now();
    let lastHi = -1;
    function frame(now) {
      if (!playing) return;
      const p = Math.min(1, (now - t0) / PLAY_DURATION_MS);
      const h = Math.round(p * last);
      if (h !== lastHi) {
        lastHi = h;
        filterLo = 0;
        filterHi = h === last ? Infinity : h;
        fromPlayback = true;
        hi.value = h;
        fromPlayback = false;
        updateUI();
        applyFilter(false);
      }
      if (p < 1) playRAF = requestAnimationFrame(frame);
      else stopPlay();
    }
    playRAF = requestAnimationFrame(frame);
  }

  btn.addEventListener('click', () => (playing ? stopPlay() : startPlay()));

  updateUI();
  document.getElementById('filter-row').style.display = 'flex';
  document.getElementById('filter-dates').style.display = 'flex';
}

fetch('rides.geojson.gz')
  .then(r => {
    const ds = new DecompressionStream('gzip');
    const decompressed = r.body.pipeThrough(ds);
    return new Response(decompressed).json();
  })
  .then(data => {
    const totalRides = data.properties?.total_rides ?? '—';
    const totalEdges = data.properties?.total_edges ?? '—';
    const updated = data.properties?.updated ?? '—';
    const maxCount = data.properties?.max_count ?? 1;
    dateList = data.properties?.dates ?? [];
    rideList = data.properties?.rides ?? [];
    rideDateIdx = rideList.map(r => r[0]);
    rideSrc = rideList.map(r => (r.length > 3 ? r[3] : -1));
    newKmByYear = data.properties?.coverage?.new_km_by_year ?? {};

    document.getElementById('stat-rides').textContent = totalRides.toLocaleString();
    document.getElementById('stat-updated').textContent = updated;
    document.getElementById('legend-max').textContent = maxCount;

    const totalKm = data.properties?.total_km;
    if (totalKm != null) {
      document.getElementById('stat-km').textContent = Math.round(mi(totalKm)).toLocaleString();
      document.getElementById('tile-km').title =
        `${totalEdges.toLocaleString()} drawn street segments`;
    }
    const ridesPerYear = data.properties?.rides_per_year;
    const riding = data.properties?.riding;
    const coverage = data.properties?.coverage;
    if (riding) {
      document.getElementById('stat-ridden').textContent =
        Math.round(mi(riding.total_km)).toLocaleString();
      document.getElementById('tile-ridden').classList.remove('hidden');
    }
    // coverage.pct is measured over a different subset than total_km: it
    // excludes config.COVERAGE_EXCLUDE ways, which the drawn miles include.
    // Quoting either side of the fraction invites a division against the
    // drawn miles that does not hold, so the tooltip qualifies the network
    // in words and ships no second mileage to compare against.
    if (coverage) {
      document.getElementById('stat-coverage').textContent = `${coverage.pct}%`;
      const tile = document.getElementById('tile-coverage');
      const excl = excludedLabel(coverage);
      tile.title =
        `Share of the rideable NYC street network` + (excl ? `; ${excl}` : '');
      tile.classList.remove('hidden');
    }
    if (ridesPerYear && Object.keys(ridesPerYear).length) {
      renderYears(ridesPerYear, riding?.km_by_year || {}, coverage?.new_km_by_year || {});
    }

    if (riding) {
      const histo = (counts, labels) => {
        const max = Math.max(...counts, 1);
        const bars = counts
          .map(c => `<div style="height:${Math.max(4, Math.round(100 * c / max))}%" title="${c} rides"></div>`)
          .join('');
        return `<div class="histo">${bars}</div><div class="histo-labels">${labels}</div>`;
      };
      const rows = [
        ['Distance', `${Math.round(mi(riding.total_km)).toLocaleString()} mi`],
        ['Time', `${Math.round(riding.total_h).toLocaleString()} h`],
        riding.avg_kmh != null ? ['Avg speed', `${(mi(riding.avg_kmh)).toFixed(1)} mph`] : null,
        ['Longest ride', `${Math.round(mi(riding.longest_km))} mi`],
      ].filter(Boolean)
        .map(([k, v]) => `<div class="r-row"><span class="label">${k}</span><strong>${v}</strong></div>`)
        .join('');
      document.getElementById('stat-riding').innerHTML = rows +
        `<div class="histo-title">Rides by hour</div>` +
        histo(riding.by_hour, '<span>12am</span><span>6</span><span>noon</span><span>6</span><span>11pm</span>') +
        `<div class="histo-title">Rides by weekday</div>` +
        histo(riding.by_weekday, '<span>Mon</span><span>Sun</span>');
      showChip('stat-riding');
    }

    const weather = data.properties?.weather;
    // A payload exported before the composition rewrite has no share/expected,
    // and half-drawing it would be worse than not drawing it at all.
    if (weather && weather.temp?.[0]?.share != null) {
      // Bars are each band's share of rides; the tick is its share of days.
      // The old chart plotted P(ride | band), which is a different question
      // from the one its own heading asked -- and not the one a bar labelled
      // "Wet" gets read as answering.
      const weatherBars = (rows) => rows.map(r =>
        `<div class="weather-bar-row" title="${r.ride_days} of ${r.days} ` +
        `${r.label} days${r.avg_mi ? `, ${r.avg_mi} mi avg` : ''}">` +
        `<span class="weather-bar-label">${r.label}</span>` +
        `<div class="weather-bar-track">` +
        `<div class="weather-bar-fill" style="width:${r.share}%"></div>` +
        `<div class="weather-bar-tick" style="left:min(${r.expected}%, calc(100% - 2px))"></div>` +
        `</div>` +
        `<span class="weather-bar-val">${Math.round(r.share)}%</span>` +
        `</div>`
      ).join('');
      // Say what the ticks show rather than leaving the reader to infer it.
      // Derived from the same rows that are drawn, so it cannot drift. An
      // even split has nothing to interpret, so it gets no note at all
      // rather than a line saying there is nothing to say.
      const weatherNote = (rows) => {
        const worst = rows.reduce((a, b) =>
          Math.abs(b.share / (b.expected || 1) - 1) > Math.abs(a.share / (a.expected || 1) - 1)
            ? b : a);
        if (Math.abs(worst.share / (worst.expected || 1) - 1) < 0.1) return '';
        return `<div class="weather-note">e.g. ${worst.label} days are ` +
          `${Math.round(worst.expected)}% of the year but ` +
          `${Math.round(worst.share)}% of rides.</div>`;
      };
      const el = document.getElementById('stat-weather');
      el.innerHTML =
        `<div class="weather-key"><i>&#9474;</i> share of all days</div>` +
        `<div class="sub-title">Rides by temperature</div>` +
        weatherBars(weather.temp) +
        weatherNote(weather.temp) +
        `<div class="sub-title">Rides by precipitation</div>` +
        weatherBars(weather.rain) +
        weatherNote(weather.rain);
      showChip('stat-weather');
    }

    renderStreets(data.properties ?? {});
    renderSpeedSplits(data.properties.speed);
    renderCitibike(data.properties?.citibike);
    initDockLayer(data.properties?.citibike);
    restoreSection();

    sqrtMax = Math.sqrt(maxCount);
    fullMaxCount = maxCount;

    geoLayer = L.geoJSON(data, {
      style: feature => styleFor((feature.properties.rides || []).length || 1),
      onEachFeature: (feature, layer) => {
        const idxs = feature.properties.rides || [];
        layer._filteredCount = idxs.length;
        layer.bindTooltip(() => {
          const c = countInRange(idxs);
          return `${c} pass${c !== 1 ? 'es' : ''}`;
        }, {
          sticky: true,
          className: 'ride-tooltip',
        });
        if (idxs.length) {
          layer.bindPopup(() => popupContent(idxs), { className: 'ride-popup' });
        }
      },
    }).addTo(map);

    initDateFilter();
    initSourceFilter();
  })
  .catch(err => {
    document.getElementById('stat-rides').textContent = 'Error loading data';
    console.error('Failed to load rides.geojson:', err);
  });
</script>
