name: Update Bike Map

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday 9am UTC
  workflow_dispatch:

jobs:
  update-map:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          allow-prereleases: true

      - name: Restore pipeline caches
        uses: actions/cache@v4
        with:
          path: |
            osm_graph_cache.pkl
            state.pkl
            render_cache.pkl
            route_cache.pkl
          key: bike-pipeline-${{ hashFiles('bike_routes.py') }}
          restore-keys: |
            bike-pipeline-

      - name: Install Python dependencies
        run: pip install .

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Sync rides from Dropbox
        env:
          RCLONE_CONFIG_DROPBOX_TYPE: dropbox
          RCLONE_CONFIG_DROPBOX_CLIENT_ID: ${{ secrets.DROPBOX_APP_KEY }}
          RCLONE_CONFIG_DROPBOX_CLIENT_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          RCLONE_CONFIG_DROPBOX_TOKEN: '{"access_token":"","token_type":"bearer","refresh_token":"${{ secrets.DROPBOX_REFRESH_TOKEN }}","expiry":"2000-01-01T00:00:00.000Z"}'
        run: |
          mkdir -p incoming
          rclone sync dropbox:Apps/bike-rides/ incoming/ --verbose

      - name: Convert GPX to CSV
        run: python gpx_to_csv.py incoming/ rides/

      - name: Run pipeline
        run: python bike_routes.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/rides.geojson.gz
          git diff --cached --quiet || git commit -m "Update bike map GeoJSON [skip ci]"
          git push
