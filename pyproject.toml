[project]
name = "nyc-bike-map"
version = "1.0.0"
description = "Visualize personal bike ride data on the NYC street network"
requires-python = ">=3.9"
dependencies = [
    "osmnx>=2.0",
    "networkx>=3.0",
    "numpy>=1.24",
    "matplotlib>=3.6",
    "scipy>=1.10",
]

[dependency-groups]
dev = ["ruff>=0.11", "ty>=0.0.1a7"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PIE"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
unresolved-import = "ignore"
