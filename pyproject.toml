[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc-bike-map"
version = "1.0.0"
description = "Visualize personal bike ride data on the NYC street network"
requires-python = ">=3.9"
dependencies = [
    "osmnx>=2.0",
    "networkx>=3.0",
    "numpy>=1.24",
    "matplotlib>=3.6",
    "scipy>=1.10",
    "leuvenmapmatching>=1.1",
    "rtree>=1.0",
    # Point-in-polygon for the neighbourhood layer. Already installed
    # transitively by osmnx; declared because bike_routes imports it directly.
    "shapely>=2.0",
]

[tool.setuptools]
packages = ["bike_routes", "bike_routes.ingest"]

[project.optional-dependencies]
# Only the ride sync needs a Garmin client; the pipeline and tests don't.
# >=0.3.2 specifically: it adds the widget+cffi login strategy, the only one
# that gets through Garmin's per-account 429 throttling on the SSO endpoints.
garmin = ["garminconnect>=0.3.2"]

[dependency-groups]
dev = ["ruff==0.16.3", "ty>=0.0.1a7", "pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." imports the bike_routes package from the working tree; "tools" makes
# the standalone analysis scripts importable without a sys.path hack.
pythonpath = [".", "tools"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "E501",     # line too long (handled by formatter)
    "T201",     # print (script uses print for CLI progress output)
    "N806",     # variable in function should be lowercase (G is networkx convention)
    "N803",     # argument name should be lowercase (G is networkx convention)
    "S301",     # pickle (self-generated local caches, not untrusted data)
    "S324",     # sha1 (config change detection, not security)
    "CPY001",   # missing copyright notice (repo is MIT; no per-file headers)
    "PLR0912",  # too many branches
    "PLR0915",  # too many statements
    "PLR0913",  # too many arguments
    "PLR0917",  # too many positional arguments (sibling of PLR0913 above)
    "C901",     # complex structure (pipeline functions are inherently complex)
    "PLR2004",  # magic value comparison (config constants are self-documenting)
    "COM812",   # missing trailing comma (conflicts with ruff formatter)
    "BLE001",   # blind except (deliberate catch-all for robustness)
    "D203",     # blank line before class docstring (incompatible with D211)
    "D213",     # multi-line summary second line (incompatible with D212)
    "S101",     # assert (fine in a pipeline script, not a library)
]

[tool.ruff.lint.per-file-ignores]
"tools/*" = [
    "INP001",   # standalone analysis scripts, deliberately not a package
]
"tests/*" = [
    "D",        # docstrings not required in tests
    "ANN",      # type annotations not required in tests
    "INP001",   # tests/ is intentionally not a package
    "SLF001",   # tests exercise private pipeline functions
]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
unresolved-import = "ignore"
